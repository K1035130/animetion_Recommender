[project]
name = "anime-recommender"
version = "0.1.0"
description = "基于偏好问卷的当季新番推荐系统"
readme = "README.md"
# 锁 3.12 对齐部署运行时，避免本地/生产解释器漂移
requires-python = ">=3.12,<3.13"

# ⚠️ **主依赖组 = 线上 serverless 真正需要的东西，一个不多。**
#    Vercel 的 Python runtime 检测到 pyproject.toml + uv.lock 就用 uv 装**主依赖组**
#    （requirements.txt 会被完全忽略 —— 别再往那里加东西）。
#    所以任何只在 ETL / 评测 / 开发时用的包都必须待在下面的 dependency-groups 里，
#    否则会被打进 function bundle。
#    ⚠️ 实测教训：polars 一个就带 55 MB 的 polars-runtime-32，而 server/ 一行没 import 它。
#    校验方式：uv run python -c "import server.main" 后看 sys.modules 的第三方闭包。
dependencies = [
    "fastapi>=0.115",
    # Neon Postgres。binary 版自带 libpq，serverless 上不能依赖系统库
    "psycopg[binary]>=3.2",
    # 连接池。Neon 的 -pooler 端点是 PgBouncer transaction 模式，
    # ⚠️ 必须配 prepare_threshold=None，否则 psycopg3 的 prepared statement
    #    会跨事务复用一个不存在的 statement 名，报 "prepared statement does not exist"
    "psycopg-pool>=3.2",
    # pgvector 的 psycopg3 适配器：让 numpy 数组能直接当参数传给 vector 列。
    # 打分推进 Postgres 之后（2026-08-12 放弃 Render 常驻进程），
    # 线上和离线两条路径都要用它。
    "pgvector>=0.3",
    # 偏好向量与 blend 重排在 Python 侧算（余弦本身在 Postgres 里）
    "numpy>=2.0",
    # 中文分词：Neon 装不了 zhparser/pgroonga，BM25 只能在 Python 侧预分词
    # ⚠️ 建库与查询必须同版本同词典，锁死
    "jieba>=0.42.1",
    # HTTP 客户端。**唯一的上线理由是 src/embed.py** —— 第 4 周流程 B 要在
    # 请求路径上编码用户查询（HyDE 改写后的假想简介），而查询是运行时才存在的，
    # 没法像 anime_profile.vec 那样离线预编码。
    # ⚠️ 2026-08-15 从 etl 组挪上来。挪之前 src/embed.py 已经躺在线上了
    #    （.vercelignore 只排 scripts/，不排 src/），但没有任何模块 import 它，
    #    靠 Python 的惰性 import 侥幸无事。一旦 server/ 引用它，炸的是
    #    **模块级 import** → ASGI app 整个构建不出来 → /health /questionnaire
    #    /recommend 全部 500，第 4 周的新功能会把第 2 周就上线的推荐一起打死。
    #    而开发机装了 etl 组，本地和测试全绿 —— 又一例「本地好好的，上线就挂」，
    #    与连接池放 lifespan、recommend.py 读不入 git 的 series_root.json 同族。
    # 净增 4 个纯 Python 小包（httpx/httpcore/h11/certifi，几 MB），
    # anyio/idna/typing-extensions 已随 fastapi→starlette 进来了。
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[dependency-groups]
# ETL 与回填脚本专用，**不上线**：uv sync --group etl
# 灌库、回填、重建向量都要它；只跑 API 或跑测试则不需要。
etl = [
    # 📌 polars 已移除（2026-08-12）：全仓库零 import，git 历史里也没用过。
    #    当初按「400 MB jsonlines 用 polars 比 pandas 快一个量级」的设想加的，
    #    但实际 ETL 全是 orjson 逐行解析 —— 流式读 jsonlines 本来就不需要 DataFrame。
    #    它带 55 MB 的 polars-runtime-32，是首次部署把依赖装歪时最扎眼的那一项。
    # Bangumi 官方 wiki 语法解析器（无向后兼容承诺，靠 uv.lock 锁死）
    "bgm-tv-wiki>=0.0.6",
    # 解析萌娘百科的 Parsoid HTML（scripts/parse_moegirl.py）。
    # ⚠️ 那份 HTML 的 <section data-mw-section-id> 最大嵌套 3 层，正则抽会静默漏内容
    #    —— 这是最坏的一类 bug（不报错，但语料少一块，第 5 周才发现）。
    # ⚠️ 只在 etl 组，**不进主依赖组**：解析是纯离线的，线上不碰 HTML。
    "lxml>=5.3",
    # 📌 httpx 已挪进主依赖组（2026-08-15），这里不再重复声明 ——
    #    backfill_anilist.py / build_id_map.py / probe_embedding_api.py 照常能用，
    #    主依赖组本来就装。理由见上面主依赖组里那段注释（src/embed.py 要上线）。
    "tqdm>=4.66",
]
# 第 3 周才装：uv sync --group embed
ml = [
    # 📌 torch / sentence-transformers 已移除（2026-08-14）：
    #    它们是「本地跑 Qwen3-Embedding 建库」方案的依赖，而 CLAUDE.md A.7
    #    已定为**全程走 API**（线上只能是 API，Vercel 跑不了模型；两条路径不一致时
    #    唯一可行的收敛方向就是把建库也搬到 API 上）。
    #    ⇒ 本地推理这条路彻底不存在了，留着就是 ~2.5 GB 的死重量。
    #    embedding 现在只需要 httpx（在 etl 组）+ src/embed.py。
    #    ⚠️ 这也是组名从 embed 改成 ml 的原因 —— 它已经不做 embedding 了。
    #
    # 第 3 周聚类（PCA + k-means + silhouette + ARI）
    # 第 5 周离线评测（NDCG / 指标计算）同样用它
    "scikit-learn>=1.5",
]
# 本地跑 API 用。⚠️ uvicorn **不上线** —— Vercel 自带 ASGI 服务器。
# argon2/pyjwt 是第 6 周账号系统才用，先放这里。
api = [
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]
dev = [
    "ruff>=0.6",
    "ipykernel>=6.29",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# 让 tests/ 能 import src/ —— 项目没打成包，靠 rootdir 进 sys.path
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
